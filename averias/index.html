const today=()=>iso(new Date());
const fD=t=>{if(!t)return '';const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);};
const fDT=t=>{if(!t)return '';const d=new Date(t);return fD(t)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const fISO=s=>{if(!s)return '';const m=/(\d{4})-(\d\d)-(\d\d)/.exec(s);return m?m[3]+'/'+m[2]+'/'+m[1].slice(2):s;};
const hrs=ms=>{if(!ms||ms<0)return '0 h';const h=ms/3600000;return h<1?Math.round(h*60)+' min':(Math.round(h*10)/10).toString().replace('.',',')+' h';};
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<60)return 'hace '+m+' min';const h=Math.round(m/60);if(h<48)return 'hace '+h+' h';return 'hace '+Math.round(h/24)+' días';};
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cleanMaq=s=>String(s||'').replace(/\*[^*]*\*/g,'').replace(/\s+/g,' ').trim();
const mKey=s=>nrm(cleanMaq(s)).replace(/[^a-z0-9]/g,'');

async function saveOT(id,patch,histTxt){
  const cur=S.ots.get(id)||{};const h=histTxt?[...(cur.historial||[]),{t:Date.now(),u:meName(),c:histTxt}].slice(-80):cur.historial;
  const d=Object.assign({},patch,{editadaEn:Date.now(),editadaPor:meName()},h?{historial:h}:{});
  if(patch.estado&&patch.estado!==cur.estado)d.estados=[...(cur.estados||[]),{t:Date.now(),u:meName(),de:cur.estado||null,a:patch.estado}].slice(-100);
  S.ots.set(id,Object.assign({},cur,d));render();
  try{ if(S.ots.has(id)&&cur.codigo) await S.db.collection('av_ot').doc(id).update(d); else await S.db.collection('av_ot').doc(id).set(Object.assign({},cur,d)); }
  catch(e){toast('No se ha podido guardar: '+(e.message||e));}
}
function nextCode(){const y=String(new Date().getFullYear()).slice(2);let mx=0;
  for(const o of S.ots.values()){const m=/^AV(\d\d)\/(\d+)$/.exec(o.codigo||'');if(m&&m[1]===y)mx=Math.max(mx,+m[2]);}
  return 'AV'+y+'/'+String(mx+1).padStart(4,'0');}
async function createOT(d){
  const id=d._id||('av'+uid());delete d._id;const t=Date.now();
  const o=Object.assign({codigo:nextCode(),estado:d.asignados&&d.asignados.length?'Asignada':'Abierta',creadaEn:t,creadaPor:meName(),intervenciones:[],material:[],fotos:[],comentarios:[],
    historial:[{t,u:meName(),c:'Creada'}],turno:turnoAhora()},d);
  o.estados=[{t,u:meName(),de:null,a:o.estado}];
  if(o.parada&&!o.paradaDesde)o.paradaDesde=t;
  S.ots.set(id,o);render();
  await S.db.collection('av_ot').doc(id).set(o);return id;}

const blobCache=new Map();
function hydrate(){document.querySelectorAll('img[data-blob]').forEach(img=>{const u=img.dataset.blob;if(blobCache.has(u)){img.src=blobCache.get(u);return;}
  fetch(u).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{const x=URL.createObjectURL(b);blobCache.set(u,x);document.querySelectorAll('img[data-blob="'+u+'"]').forEach(i=>i.src=x);}).catch(()=>{});});}
function shrink(file){return new Promise(res=>{if(!/^image\//.test(file.type)||file.size<500*1024)return res(file);const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',.85);};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file);};img.src=u;});}
async function uploadFotos(files){const out=[];for(const f of [...files].slice(0,6)){const b=await shrink(f);const r=await S.assets.upload(b,{type:b.type||'image/jpeg'});out.push({url:r.url,id:r.id,name:f.name,t:Date.now()});}return out;}

async function genPreventivos(){if(!S.ready)return;const t=today();
  for(const [pid,p] of S.prev){if(!p.activo||!p.proxima)continue;const lead=addDays(t,+(p.antelacion||0),'dias');if(p.proxima>lead)continue;
    const oid='pv-'+pid+'-'+p.proxima;if(S.ots.has(oid))continue;
    const abierta=[...S.ots.values()].some(o=>o.planId===pid&&OPEN(o.estado));if(abierta)continue;
    await createOT({_id:oid,titulo:'Preventivo: '+p.tarea,descripcion:(p.checklist||[]).length?'Revisar:\n'+(p.checklist||[]).map(x=>'· '+x).join('\n'):p.tarea,maqId:p.maqId,maqNombre:(S.maq.get(p.maqId)||{}).nombre||p.maqNombre||'',
      tipo:'Preventivo',clase:p.clase||'Mecánica',prioridad:p.prioridad||'Media',parada:false,origen:'Revisión preventiva',solicitante:'Plan preventivo',asignados:p.tecnico?[p.tecnico]:[],
      planId:pid,previsto:p.proxima,checklist:(p.checklist||[]).map(x=>({txt:x,ok:false}))});}}

function otRowsHtml(rows,opts){opts=opts||{};if(!rows.length)return '<div class="card empty">No hay órdenes con estos filtros.</div>';
  return '<div class="tbl"><table class="fx"><thead><tr><th>Detalles</th><th>Máquina</th><th>Estado</th><th>Prioridad</th><th class="hm">Tipo</th><th class="hm">Inicio</th><th class="hm">Finalización</th><th class="hm">Técnicos</th><th></th></tr></thead><tbody>'+
   rows.map(([id,o])=>{const runs=(o.intervenciones||[]).filter(i=>!i.fin).map(i=>i.tecnico);
    return '<tr class="'+(isStop(o)?'stop':'')+'" data-go="ot/'+esc(id)+'"><td><a class="code" href="#ot/'+esc(id)+'">'+esc(o.codigo)+'</a><div class="ttl">'+esc(o.titulo||'(sin título)')+'</div>'+(isStop(o)?'<div class="pstop">⛔ Máquina parada</div>':'')+'</td>'+
     '<td class="mq">'+esc(maqName(o))+'<div class="sm">'+esc(maqSec(o))+'</div></td><td>'+eSelect(id,o)+'</td><td>'+pBlock(o.prioridad)+'</td><td class="hm">'+tBlock(o)+'</td>'+
     '<td class="hm nowrap">'+fD(o.creadaEn)+'</td><td class="hm nowrap">'+(o.cerradaEn?fD(o.cerradaEn):'')+'</td>'+
     '<td class="hm sm">'+(runs.length?'<b class="run">● '+esc(runs.join(', '))+'</b>':esc((o.asignados||[]).join(', ')))+(horasOT(o)?'<div>'+hrs(horasOT(o))+'</div>':'')+'</td>'+
     '<td class="acts"><a class="ib b-blue" href="#ot/'+esc(id)+'" title="Ver">'+IC.eye+'</a></td></tr>';}).join('')+'</tbody></table></div>';}
function otCard(id,o){return otRowsHtml([[id,o]]);}
/* ---------- PANEL ---------- */
function vPanel(){const all=[...S.ots.entries()],open=all.filter(([,o])=>OPEN(o.estado));
  const stop=open.filter(([,o])=>isStop(o)),crit=open.filter(([,o])=>o.prioridad==='Crítica'),mat=open.filter(([,o])=>/Bloqueada/.test(o.estado)),sin=open.filter(([,o])=>!(o.asignados||[]).length),curso=open.filter(([,o])=>runInt(o));
  const venc=[...S.prev.entries()].filter(([,p])=>p.activo&&p.proxima&&p.proxima<=today());
  const k=(n,l,c,go)=>'<a class="kpi '+c+'" href="#'+go+'"><b>'+n+'</b><span>'+l+'</span></a>';
  const carga={};cfg().tecnicos.forEach(t=>carga[t]=0);open.forEach(([,o])=>(o.asignados||[]).forEach(a=>carga[a]=(carga[a]||0)+1));const cmax=Math.max(1,...Object.values(carga));
  return crumbs([['Panel de mantenimiento']],'<a class="btn blue" href="#nueva">'+IC.plus+' Crear orden de trabajo</a>')+
    '<div class="kpis">'+k(open.length,'Órdenes abiertas','','ots/abiertas')+k(stop.length,'Máquinas paradas','red'+(stop.length?' kblink':''),'ots/paradas')+k(crit.length,'Críticas abiertas','red','ots/criticas')+k(curso.length,'Trabajando ahora','','encurso')+k(mat.length,'Bloqueadas por material','','ots/bloqueadas')+k(sin.length,'Sin asignar','','ots/sinasignar')+k(venc.length,'Preventivos vencidos','','preventivo')+'</div>'+
    '<div class="card'+(stop.length?' stoplist':'')+'"><div class="ch">'+(stop.length?'<span class="pblink">● '+stop.length+' PARADA'+(stop.length>1?'S':'')+'</span>':'')+' Máquinas paradas ahora</div>'+(stop.length?otRowsHtml(stop.sort((a,b)=>a[1].creadaEn-b[1].creadaEn)):'<div class="empty">Ninguna máquina parada.</div>')+'</div>'+
    '<div class="g2"><div class="card"><div class="ch">Carga por técnico</div><div class="cb">'+Object.entries(carga).sort((a,b)=>b[1]-a[1]).map(([t,n])=>'<div class="hbar"><span class="l">'+esc(t)+'</span><span class="b" style="width:'+Math.round(n/cmax*150)+'px"></span><b>'+n+'</b></div>').join('')+'</div></div>'+
    '<div class="card"><div class="ch">Avisos por semana</div><div class="cb">'+weekBars()+'</div></div></div>'+
    '<div class="card"><div class="ch">Preventivos próximos</div><div class="cb">'+prevMini()+'</div></div>';}
function prevMini(){const l=[...S.prev.entries()].filter(([,p])=>p.activo&&p.proxima).sort((a,b)=>a[1].proxima.localeCompare(b[1].proxima)).slice(0,6);
  if(!l.length)return '<div class="muted small">Todavía no hay planes. Créalos en Planificación.</div>';
  return '<table class="plain">'+l.map(([id,p])=>'<tr data-go="preventivo"><td class="nowrap">'+(p.proxima<=today()?'<span class="dt" style="--c:#dc2626"></span>':'<span class="dt" style="--c:#22a447"></span>')+fISO(p.proxima)+'</td><td><b>'+esc(p.tarea)+'</b></td><td class="muted">'+esc((S.maq.get(p.maqId)||{}).nombre||p.maqNombre||'')+'</td></tr>').join('')+'</table>';}
function weekBars(){const w=[];const now=new Date();now.setHours(0,0,0,0);const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  for(let i=7;i>=0;i--){const a=new Date(mon);a.setDate(mon.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+7);w.push({l:pad(a.getDate())+'/'+pad(a.getMonth()+1),n:[...S.ots.values()].filter(o=>o.creadaEn>=a&&o.creadaEn<b&&o.tipo!=='Preventivo').length});}
  const mx=Math.max(1,...w.map(x=>x.n));return '<div class="bars">'+w.map(x=>'<div style="height:'+Math.round(x.n/mx*100)+'%"><span>'+x.n+'</span></div>').join('')+'</div><div class="barl">'+w.map(x=>'<div>'+x.l+'</div>').join('')+'</div>';}
/* ---------- LISTADO DE OT ---------- */
const PRESETS={abiertas:'Abiertas',paradas:'Máquinas paradas',criticas:'Críticas',curso:'Trabajando ahora',bloqueadas:'Bloqueadas por material',sinasignar:'Sin asignar',finalizadas:'Finalizadas',todas:'Todas'};
function filterOTs(preset){const f=S.f,q=nrm(f.q).split(/\s+/).filter(Boolean);
  return [...S.ots.entries()].filter(([,o])=>{
    switch(preset){case 'abiertas':if(!OPEN(o.estado))return false;break;case 'paradas':if(!isStop(o))return false;break;case 'criticas':if(!OPEN(o.estado)||o.prioridad!=='Crítica')return false;break;
      case 'curso':if(!runInt(o))return false;break;case 'bloqueadas':if(!/Bloqueada/.test(o.estado))return false;break;case 'sinasignar':if(!OPEN(o.estado)||(o.asignados||[]).length)return false;break;case 'finalizadas':if(o.estado!=='Finalizada')return false;break;}
    if(f.prio&&o.prioridad!==f.prio)return false;if(f.tec&&!(o.asignados||[]).includes(f.tec))return false;if(f.sec&&maqSec(o)!==f.sec)return false;if(f.tipo&&tipoOf(o)!==f.tipo)return false;
    if(q.length){const h=nrm([o.codigo,o.titulo,o.descripcion,maqName(o),maqSec(o),o.clase,tipoOf(o),(o.asignados||[]).join(' '),o.solicitante,o.fxCodigo].join(' '));if(!q.every(w=>h.includes(w)))return false;}
    return true;}).sort((a,b)=>b[1].creadaEn-a[1].creadaEn);}
function selOpts(list,v,all){return '<option value="">'+all+'</option>'+list.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');}
function vOTs(arg){const preset=PRESETS[arg]?arg:'abiertas',l=filterOTs(preset),c=cfg(),tipos=[...new Set([...S.ots.values()].map(tipoOf))].sort();
  return crumbs([['Órdenes de trabajo']],'<a class="btn blue" href="#nueva">'+IC.plus+' Crear orden de trabajo</a>')+
    '<div class="toolbar"><button class="ib" data-a="refresh" title="Actualizar">'+IC.refresh+'</button><button class="ib" data-a="csv" title="Exportar a Excel">'+IC.xls+'</button>'+
    '<select data-a="preset">'+Object.entries(PRESETS).map(([k,t])=>'<option value="'+k+'"'+(k===preset?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<select data-f="prio">'+selOpts(PRIOS,S.f.prio,'Prioridad')+'</select><select data-f="tipo">'+selOpts(tipos,S.f.tipo,'Tipo')+'</select><select data-f="tec">'+selOpts(c.tecnicos,S.f.tec,'Técnico')+'</select><select data-f="sec">'+selOpts(c.secciones,S.f.sec,'Sección')+'</select>'+
    '<span class="sp"></span><span class="muted small">'+l.length+' órdenes</span><input type="search" id="fq" data-live="1" placeholder="Código, máquina, avería…" value="'+esc(S.f.q)+'"></div>'+
    otRowsHtml(l.slice(0,400));}
function vMis(){const me=nrm(meName());const l=[...S.ots.entries()].filter(([,o])=>OPEN(o.estado)&&(o.asignados||[]).some(a=>nrm(a)===me)).sort((a,b)=>b[1].creadaEn-a[1].creadaEn);
  return crumbs([['Mis órdenes']])+'<p class="muted small">Órdenes abiertas asignadas a <b>'+esc(meName())+'</b>.</p>'+otRowsHtml(l);}
function vEnCurso(){const r=[];for(const [id,o] of S.ots)(o.intervenciones||[]).forEach(i=>{if(!i.fin)r.push([id,o,i]);});r.sort((a,b)=>a[2].inicio-b[2].inicio);
  return crumbs([['Trabajos en curso']])+(r.length?'<div class="tbl"><table class="fx"><thead><tr><th>Técnico</th><th>Orden</th><th>Máquina</th><th>Desde</th><th>Tiempo</th><th></th></tr></thead><tbody>'+
    r.map(([id,o,i])=>'<tr data-go="ot/'+esc(id)+'"><td><b>'+esc(i.tecnico)+'</b></td><td><a class="code" href="#ot/'+esc(id)+'">'+esc(o.codigo)+'</a><div class="ttl">'+esc(o.titulo)+'</div></td><td>'+esc(maqName(o))+'</td><td class="nowrap">'+fDT(i.inicio)+'</td><td><b class="live mono" data-base="0" data-since="'+i.inicio+'">'+clock(Date.now()-i.inicio)+'</b></td><td><button class="btn sm" data-a="parart" data-id="'+esc(id)+'" data-t="'+esc(i.tecnico)+'">'+IC.pause+' Parar</button></td></tr>').join('')+'</tbody></table></div>':'<div class="card empty">Ahora mismo nadie está trabajando en ninguna orden.</div>');}
function vTiempos(){const days=+(S.tD||7),from=Date.now()-days*864e5,tec=S.tT||'',r=[];
  for(const [id,o] of S.ots)(o.intervenciones||[]).forEach(i=>{if(i.inicio>=from&&(!tec||i.tecnico===tec))r.push([id,o,i]);});r.sort((a,b)=>b[2].inicio-a[2].inicio);
  const tot={};r.forEach(([,,i])=>tot[i.tecnico]=(tot[i.tecnico]||0)+((i.fin||Date.now())-i.inicio));
  return crumbs([['Registros de tiempo']])+'<div class="toolbar"><select data-a="tD">'+[[1,'Hoy'],[7,'Últimos 7 días'],[30,'Últimos 30 días'],[365,'Último año']].map(([d,t])=>'<option value="'+d+'"'+(d===days?' selected':'')+'>'+t+'</option>').join('')+'</select><select data-a="tT">'+selOpts(cfg().tecnicos,tec,'Todos los técnicos')+'</select><span class="sp"></span>'+
    Object.entries(tot).map(([t,ms])=>'<span class="chip">'+esc(t)+': <b>'+hrs(ms)+'</b></span>').join('')+'</div>'+
    (r.length?'<div class="tbl"><table class="fx"><thead><tr><th>Responsable</th><th>Orden</th><th>Máquina</th><th>Fecha inicio</th><th>Fecha fin</th><th>Tiempo realizado</th><th class="hm">Trabajo</th></tr></thead><tbody>'+
    r.map(([id,o,i])=>'<tr data-go="ot/'+esc(id)+'"><td><b>'+esc(i.tecnico)+'</b></td><td><a class="code" href="#ot/'+esc(id)+'">'+esc(o.codigo)+'</a></td><td>'+esc(maqName(o))+'</td><td class="nowrap">'+fDT(i.inicio)+'</td><td class="nowrap">'+(i.fin?fDT(i.fin):'<b class="run">en curso</b>')+'</td><td><b>'+hm((i.fin||Date.now())-i.inicio)+'</b></td><td class="hm sm">'+esc(i.trabajo||'')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card empty">Sin registros en este periodo.</div>');}
const hm=ms=>{ms=Math.max(0,ms);return Math.floor(ms/3600000)+'h '+(Math.floor(ms/60000)%60)+'m';};

      (open?(myRun?'<button class="ib b-blue on" data-a="parart" data-t="'+esc(meName())+'" title="Parar mi tiempo">'+IC.pause+'</button>':'<button class="ib b-blue" data-a="iniciart" data-t="'+esc(meName())+'" title="Empezar a trabajar (cronómetro)">'+IC.play+'</button>'):'')+'</div>')+

    case 'delpend':{pend.splice(+b.dataset.i,1);const pv=document.getElementById('pendprev');if(pv)pv.innerHTML=pendHtml();break;}

    case 'edtxt':{const k=b.dataset.k;askText(k==='descripcion'?'Trabajo a realizar':'Observaciones del trabajo realizado',o[k]||'',true,async v=>{await saveOT(id,{[k]:v.trim()},k==='descripcion'?'Trabajo a realizar editado':'Observaciones editadas');});break;}

      const it={desc:d,cant:+m.querySelector('#mc').value||1,ref:m.querySelector('#mr').value.trim(),t:Date.now(),fotos};const ped=m.querySelector('#mp').checked;m.remove();
      const l=[...(o.material||[]),it];await saveOT(id,{material:l},'Material: '+d);if(ped)await pedirMaterial(id,l.length-1);};});}
async function pedirMaterial(id,ix){const o=S.ots.get(id),m=o.material[ix];const rid='av-'+id+'-'+ix+'-'+(m.t||0);const t=Date.now();
  await S.db.collection('recambios').doc(rid).set({fecha:today(),descripcion:String(m.desc).toUpperCase().slice(0,70),maquina:String(maqName(o)).toUpperCase(),solicitante:meName().toUpperCase(),ot:o.codigo,compra:'X',urgente:o.prioridad==='Crítica'||isStop(o),
    explicacion:'Desde Averías: '+o.codigo+' «'+(o.titulo||'')+'» — '+m.cant+' ud.'+(m.ref?' · ref. '+m.ref:'')+(isStop(o)?' · MÁQUINA PARADA':''),origen:'averias',creadoEn:t,orden:t,
    fotos:(m.fotos||[]).filter(f=>f.id||f.url).slice(0,4).map(f=>({id:f.id||String(f.url).split('/').pop(),nombre:f.name||'foto.jpg',fecha:today(),por:''}))});
  const l=(o.material||[]).map((x,i)=>i===ix?Object.assign({},x,{recId:rid}):x);
  const p={material:l};if(o.estado==='En curso'||o.estado==='Asignada'||o.estado==='Abierta')p.estado=isStop(o)?'Bloqueada PA':'Bloqueada OP';
  await saveOT(id,p,'Pedido a recambios: '+m.desc);toast('Pedido creado en la web de recambios');}
function otForm(id){const o=S.ots.get(id),c=cfg();
  modal('<h2>Editar '+esc(o.codigo)+'</h2><label>Título</label><input id="et" value="'+esc(o.titulo)+'"><label>Descripción</label><textarea id="ed">'+esc(o.descripcion||'')+'</textarea><label>Máquina</label><select id="em">'+maqOptions(o.maqId)+'</select>'+
    '<div class="grid g2"><div><label>Prioridad</label><select id="ep">'+PRIOS.map(p=>'<option'+(p===o.prioridad?' selected':'')+'>'+p+'</option>').join('')+'</select></div><div><label>Tipo de avería</label><select id="ec">'+selOpts(c.clases,o.clase,'—')+'</select></div><div><label>Tipo de trabajo</label><select id="ey">'+selOpts(c.tipos,o.tipo,'—')+'</select></div><div><label>Estado</label><select id="es">'+ESTADOS.map(x=>'<option'+(x===o.estado?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+
    '<label>Asignada a</label><div>'+c.tecnicos.map(t=>'<label class="check" style="display:inline-flex;margin-right:12px"><input type="checkbox" class="ea" value="'+esc(t)+'"'+((o.asignados||[]).includes(t)?' checked':'')+'> '+esc(t)+'</label>').join('')+'</div>'+
    '<label class="check"><input type="checkbox" id="epa"'+(o.parada?' checked':'')+'> <span>Máquina parada</span></label><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="ex">Cancelar</button><button class="btn primary" id="eo">Guardar</button></div>',m=>{
    m.querySelector('#ex').onclick=()=>m.remove();
    m.querySelector('#eo').onclick=async()=>{const mid=m.querySelector('#em').value,par=m.querySelector('#epa').checked,t=Date.now();
      const p={titulo:m.querySelector('#et').value.trim(),descripcion:m.querySelector('#ed').value.trim(),prioridad:m.querySelector('#ep').value,clase:m.querySelector('#ec').value,tipo:m.querySelector('#ey').value,estado:m.querySelector('#es').value,asignados:[...m.querySelectorAll('.ea:checked')].map(x=>x.value),parada:par};
      if(mid&&mid!=='__otra'){p.maqId=mid;p.maqNombre=(S.maq.get(mid)||{}).nombre;p.seccion=(S.maq.get(mid)||{}).seccion;}
      if(par&&!o.parada){p.paradaDesde=t;p.paradaHasta=null;}if(!par&&o.parada&&!o.paradaHasta)p.paradaHasta=t;m.remove();await saveOT(id,p,'Datos editados');};});}
function maqForm(mid){const m0=mid?S.maq.get(mid):{nombre:'',seccion:'',activa:true},c=cfg();
  modal('<h2>'+(mid?'Editar máquina':'Nueva máquina')+'</h2><label>Nombre</label><input id="qn" value="'+esc(m0.nombre)+'"><div class="grid g2"><div><label>Sección</label><input id="qs" list="secs" value="'+esc(m0.seccion||'')+'"><datalist id="secs">'+c.secciones.map(s=>'<option value="'+esc(s)+'">').join('')+'</datalist></div><div><label>Código interno</label><input id="qc" value="'+esc(m0.codigo||'')+'"></div>'+
    '<div><label>Fabricante</label><input id="qf" value="'+esc(m0.fabricante||'')+'"></div><div><label>Modelo</label><input id="qm" value="'+esc(m0.modelo||'')+'"></div><div><label>Ubicación</label><input id="qu" value="'+esc(m0.ubicacion||'')+'"></div></div><label>Notas</label><textarea id="qt">'+esc(m0.notas||'')+'</textarea>'+
    '<label class="check"><input type="checkbox" id="qk"'+(m0.critica?' checked':'')+'> <span>Máquina crítica</span></label><label class="check"><input type="checkbox" id="qa"'+(m0.activa!==false?' checked':'')+'> <span>En servicio (desmárcala si se da de baja)</span></label>'+
    '<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="qx">Cancelar</button><button class="btn primary" id="qo">Guardar</button></div>',m=>{
    m.querySelector('#qx').onclick=()=>m.remove();
    m.querySelector('#qo').onclick=async()=>{const n=m.querySelector('#qn').value.trim();if(!n){toast('Pon el nombre');return;}const id=mid||('m'+uid());
      const d={nombre:n,seccion:m.querySelector('#qs').value.trim(),codigo:m.querySelector('#qc').value.trim(),fabricante:m.querySelector('#qf').value.trim(),modelo:m.querySelector('#qm').value.trim(),ubicacion:m.querySelector('#qu').value.trim(),notas:m.querySelector('#qt').value.trim(),critica:m.querySelector('#qk').checked,activa:m.querySelector('#qa').checked};
      m.remove();await saveMaq(id,d);toast('Máquina guardada');if(!mid)location.hash='maq/'+id;};});}
function prevForm(pid,maqPre){const p=pid?S.prev.get(pid):{tarea:'',maqId:maqPre||'',cadaN:1,unidad:'meses',proxima:today(),activo:true,checklist:[],prioridad:'Media',antelacion:0},c=cfg();
  modal('<h2>'+(pid?'Editar plan':'Nuevo plan de preventivo')+'</h2><label>Tarea</label><input id="pt" value="'+esc(p.tarea)+'" placeholder="Ej. Engrase general y revisión de correas"><label>Máquina</label><select id="pm">'+maqOptions(p.maqId)+'</select>'+
    '<div class="grid g3"><div><label>Cada</label><input id="pn" type="number" min="1" value="'+esc(p.cadaN)+'"></div><div><label>&nbsp;</label><select id="pu">'+['dias','semanas','meses'].map(u=>'<option'+(u===p.unidad?' selected':'')+'>'+u+'</option>').join('')+'</select></div><div><label>Próxima fecha</label><input id="pf" type="date" value="'+esc(p.proxima)+'"></div>'+
    '<div><label>Técnico</label><select id="pk">'+selOpts(c.tecnicos,p.tecnico,'Sin asignar')+'</select></div><div><label>Prioridad</label><select id="pp">'+PRIOS.map(x=>'<option'+(x===p.prioridad?' selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>Crear OT con antelación (días)</label><input id="pa" type="number" min="0" value="'+esc(p.antelacion||0)+'"></div></div>'+
    '<label>Puntos a revisar (uno por línea)</label><textarea id="pc" rows="5">'+esc((p.checklist||[]).join('\n'))+'</textarea><label class="check"><input type="checkbox" id="pv"'+(p.activo!==false?' checked':'')+'> <span>Plan activo</span></label>'+
    '<div class="row" style="margin-top:12px">'+(pid?'<button class="btn danger" id="pd">Borrar plan</button>':'')+'<span class="sp"></span><button class="btn" id="px">Cancelar</button><button class="btn primary" id="po">Guardar</button></div>',m=>{
    m.querySelector('#px').onclick=()=>m.remove();
    if(pid)m.querySelector('#pd').onclick=async()=>{if(!confirm('¿Borrar este plan? Las OT ya creadas se quedan.'))return;m.remove();S.prev.delete(pid);render();await S.db.collection('av_prev').doc(pid).delete();};
    m.querySelector('#po').onclick=async()=>{const t=m.querySelector('#pt').value.trim(),mid=m.querySelector('#pm').value;if(!t||!mid||mid==='__otra'){toast('Pon la tarea y elige la máquina');return;}
      const d={tarea:t,maqId:mid,maqNombre:(S.maq.get(mid)||{}).nombre||'',cadaN:+m.querySelector('#pn').value||1,unidad:m.querySelector('#pu').value,proxima:m.querySelector('#pf').value||today(),tecnico:m.querySelector('#pk').value,prioridad:m.querySelector('#pp').value,antelacion:+m.querySelector('#pa').value||0,
        checklist:m.querySelector('#pc').value.split('\n').map(s=>s.trim()).filter(Boolean),activo:m.querySelector('#pv').checked};m.remove();await savePrev(pid||('p'+uid()),d);toast('Plan guardado');genPreventivos();};});}
/* ====== exportar ====== */
function exportCSV(){const rows=[['Código','Estado','Prioridad','Tipo','Avería','Máquina','Sección','Título','Descripción','Parada','Creada','Creada por','Avisa','Asignados','Horas trabajo','Tiempo parada (h)','Cerrada','Causa','Solución']];
  for(const o of S.ots.values())rows.push([o.codigo,o.estado,o.prioridad,o.tipo,o.clase,maqName(o),maqSec(o),o.titulo,o.descripcion,o.parada?'Sí':'No',fDT(o.creadaEn),o.creadaPor,o.solicitante,(o.asignados||[]).join(', '),(horasOT(o)/3600000).toFixed(2).replace('.',','),(paradaMs(o)/3600000).toFixed(2).replace('.',','),fDT(o.cerradaEn),o.cierre&&o.cierre.causa,o.cierre&&o.cierre.solucion]);
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ordenes-trabajo-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);}
/* ====== importar desde Fixner / recambios (una vez; ids fijos para no duplicar) ====== */
function guessSec(n){const s=nrm(n);if(/holweg|newlong|bolsa|garant|fischer/.test(s))return 'Bolsas';if(/servillet|canguro|teyman|omet|fold|perini/.test(s))return 'Servilletas 1';if(/mantel|didde|resmadora/.test(s))return 'Manteles';if(/carton|jores|prensa|heiber|kolbus|sicosa|troquel/.test(s))return 'Cartón';if(/dispens|toallit/.test(s))return 'Dispensing';if(/compres|caldera|electric|instal|nave|aire/.test(s))return 'Instalaciones';if(/taller/.test(s))return 'Mantenimiento';return '';}
async function importMaq(){const have=new Set([...S.maq.values()].map(m=>mKey(m.nombre)));const names=new Map();
  for(const o of S.fx.values()){const n=cleanMaq(o.activo);if(n&&n.length>1)names.set(mKey(n),n);}
  const nuevas=[...names.entries()].filter(([k])=>k&&!have.has(k));if(!nuevas.length){toast('No hay máquinas nuevas que cargar');return;}
  if(!confirm('Se crearán '+nuevas.length+' máquinas (sacadas de los activos de Fixner). La sección se intenta adivinar; revísala luego. ¿Seguir?'))return;
  let n=0;for(const [k,nm] of nuevas){await S.db.collection('av_maq').doc('mx-'+k.slice(0,40)).set({nombre:nm,seccion:guessSec(nm),activa:true,origen:'importada'});n++;}
  toast(n+' máquinas creadas');}
async function importFx(){const byKey=new Map([...S.maq.entries()].map(([id,m])=>[mKey(m.nombre),id]));
  const l=[...S.fx.values()].filter(o=>o.estado&&o.estado!=='Finalizada'&&o.codigo&&!S.ots.has('fx-'+o.codigo.replace('/','-')));
  if(!l.length){toast('No hay OT de Fixner nuevas que pasar');return;}
  if(!confirm('Se pasarán '+l.length+' OT abiertas de Fixner, con su estado y prioridad. ¿Seguir?'))return;
  const pm={'CRÍTICA':'Crítica','CRITICA':'Crítica','ALTA':'Alta','MEDIA':'Media','BAJA':'Baja'};
  const em={'Abierta':'Abierta','Aceptada':'Asignada','Reabierta':'Abierta','Pausada':'Pausada','Bloqueada OP':'Bloqueada OP','Bloqueada PA':'Bloqueada PA'};
  let n=0;for(const o of l){const id='fx-'+o.codigo.replace('/','-'),mn=cleanMaq(o.activo),mid=byKey.get(mKey(mn))||'';const m=/(\d+)\/(\d+)\/(\d+)/.exec(o.inicio||'');const t=m?new Date(+m[3],+m[2]-1,+m[1],8).getTime():Date.now();
    const d={codigo:o.codigo,fxCodigo:o.codigo,titulo:o.descripcion||'(sin descripción en Fixner)',descripcion:'Traída de Fixner ('+o.codigo+'). Tipo en Fixner: '+(o.tipo||'—')+'.',maqId:mid,maqNombre:mn,seccion:mid?(S.maq.get(mid)||{}).seccion:'',
      estado:em[o.estado]||'Abierta',prioridad:pm[String(o.prioridad||'').toUpperCase()]||'Media',parada:o.estado==='Bloqueada PA',tipo:/prevent/i.test(o.tipo||'')?'Preventivo':'Avería',clase:/el[eé]ctric/i.test(o.tipo||'')?'Eléctrica':/mec[aá]nic/i.test(o.tipo||'')?'Mecánica':'Otros',
      origen:'Fixner',solicitante:'',asignados:[],creadaEn:t,creadaPor:'Importada de Fixner',intervenciones:[],material:[],fotos:[],comentarios:[],historial:[{t:Date.now(),u:meName(),c:'Importada de Fixner'}]};
    if(d.parada)d.paradaDesde=t;await S.db.collection('av_ot').doc(id).set(d);n++;}
  toast(n+' OT traídas de Fixner');}
/* ====== arranque ====== */
(async()=>{
  S.db=await claude.use('db');S.assets=await claude.use('assets');const u=await claude.use('user');S.me=await u.me();S.admin=await u.isOwner();
  $('#who').textContent=meName();
  const on=(col,fn)=>S.db.collection(col).onSnapshot(sn=>{fn(sn);if(S.ready){render();if(col==='av_prev'||col==='av_ot')schedGen();}});
  on('av_ot',sn=>{S.ots=new Map(sn.docs.map(d=>[d.id,d.data()]));});
  on('av_maq',sn=>{S.maq=new Map(sn.docs.map(d=>[d.id,d.data()]));});
  on('av_prev',sn=>{S.prev=new Map(sn.docs.map(d=>[d.id,d.data()]));});
  on('av_cfg',sn=>{const d=sn.docs.find(x=>x.id==='main');S.cfg=d?d.data():null;});
  on('recambios',sn=>{S.rec=sn.docs.map(d=>({id:d.id,...d.data()}));});
  on('fixner_ots',sn=>{S.fx=new Map(sn.docs.filter(d=>d.id!=='_meta').map(d=>[d.id,d.data()]));});
  await S.db.collection('av_ot').get();
  S.ready=true;route();schedGen();
  setInterval(()=>{if(S.view==='ot'||S.view==='panel')render();},60000);
})();
let gT=null;function schedGen(){clearTimeout(gT);gT=setTimeout(()=>genPreventivos().catch(()=>{}),1500);}
window.__av=S;
})();
