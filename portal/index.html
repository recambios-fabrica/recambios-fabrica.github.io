function calEvents(ms,me_){
  var ev=S.events.filter(function(e){return e.date>=ms&&e.date<=me_;}).map(function(e){return {id:e.id,date:e.date,title:e.title,desc:e.desc,type:e.type};});
  S.payroll.forEach(function(r){var l=periodLabel(r.period);
    if(r.close>=ms&&r.close<=me_)ev.push({id:null,date:r.close,title:'Cierre de nómina',desc:'Nómina de '+l+': último día para comunicar incidencias, horas extras y cambios.',type:'Nómina'});
    if(r.pay>=ms&&r.pay<=me_)ev.push({id:null,date:r.pay,title:'Pago de nómina',desc:'Nómina de '+l+': fecha prevista de ingreso del salario.',type:'Nómina'});});
  return ev.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
}
// ---- vacaciones ----
var VAC_DEFAULT=22, VAC_AUTO_FROM=2026; // días laborables por año; el arrastre automático empieza con los datos de 2026
function vacOffDays(){var m={};S.events.forEach(function(e){if(e.type==='Festivo'||e.type==='Vacaciones empresa')m[e.date]=1;});return m;}
function isWorkDay(k,off){var d=new Date(k+'T12:00:00'),w=d.getDay();return w!==0&&w!==6&&!off[k];}
function vacDaysOf(l,year,off){var n=0,d=new Date(l.start+'T12:00:00'),e=new Date(l.end+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1)){var k=isoD(d);if(year&&+k.slice(0,4)!==year)continue;if(isWorkDay(k,off))n++;}return n;}
function vacAnual(u){var v=+(u&&u.vacAnual);return v>0?v:VAC_DEFAULT;}
function vacInfo(u,year){var off=vacOffDays(),used=0,pend=0;

  if(!m)return null;var name=m[1].toLowerCase();return [+m[2],name==='setiembre'?9:MONTHS.indexOf(name)+1];
}

var CAR_COLORS=[['blanc','#f4f6f8'],['negr','#25292e'],['gris','#8a939c'],['plat','#c5cbd1'],['granat','#7b1f2e'],['roj','#c62f2f'],['azul','#2f5fb3'],['verd','#3f8a4f'],['amarill','#e8c33a'],['naranj','#e27a2c'],['marr','#7a5236'],['beig','#d8c7a3'],['rosa','#e48aa8'],['morad','#6b4aa0'],['dorad','#c9a24a'],['bronce','#a46b3c']];

  function wheel(x,y,r,r2){return w.replace(/X/g,x).replace(/Y/g,y).replace('r="R"','r="'+r+'"').replace('r="r2"','r="'+r2+'"');}
  var inner;

  else inner='<path d="M8 41 L12 31 Q16 26 25 25 L41 24 L52 15 Q55 13 60 13 L80 13 Q86 13 90 17 L98 25 L108 27 Q113 28 113 33 L113 41 Z" fill="'+c+'" stroke="#33475b" stroke-width="1.8"/><path d="M46 25 L54 17 Q56 16 59 16 L69 16 L69 25 Z" fill="#cfe2f3" stroke="#33475b" stroke-width="1"/><path d="M72 16 L80 16 Q84 16 87 19 L93 25 L72 25 Z" fill="#cfe2f3" stroke="#33475b" stroke-width="1"/>'+wheel(30,43,8.5,3.5)+wheel(92,43,8.5,3.5);

function vehicleState(eid){

}

var BLOBS={};
function imgAttr(u){u=String(u||'');return /^\/_blob\//.test(u)?'data-blob="'+esc(u)+'" src="'+(BLOBS[u]||'data:image/gif;base64,R0lGODlhAQABAAAAACw=')+'"':'src="'+esc(u)+'"';}
function hydrateBlobs(){document.querySelectorAll('img[data-blob]').forEach(function(img){var u=img.getAttribute('data-blob');if(BLOBS[u]){img.src=BLOBS[u];return;}if(BLOBS[u]===false)return;BLOBS[u]=false;
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){BLOBS[u]=URL.createObjectURL(b);document.querySelectorAll('img[data-blob="'+u+'"]').forEach(function(i){i.src=BLOBS[u];});},function(){delete BLOBS[u];});});}
new MutationObserver(function(){hydrateBlobs();}).observe(document.documentElement,{childList:true,subtree:true});

function render(scrollTop){
  var root=document.getElementById('app');
  if(MODE==='loading'){root.innerHTML='<div class="demo-state"><div class="crest big">G</div><h1>Portal del empleado</h1><p class="muted">Cargando…</p></div>';return;}
  if(MODE==='offline'){root.innerHTML='<div class="demo-state"><div class="crest big">G</div><h1>No se puede conectar</h1><p class="muted">Ahora mismo no se puede conectar con el servidor del portal. Comprueba la conexión e inténtalo más tarde.</p><button class="primary" onclick="location.reload()">Reintentar</button></div>';return;}
  if(MODE==='setup'){root.innerHTML=vSetup();return;}
  if(MODE==='empty'){root.innerHTML='<div class="demo-state"><div class="crest big">G</div><h1>Demo compartida sin datos</h1><p class="muted">Todavía no hay datos de ejemplo. Cárgalos para que todos los que abran la página vean lo mismo.</p><button class="primary" data-act="seedshared">Cargar datos de ejemplo</button>'+(readOnly?'<p class="flash error">Solo el propietario o quien tenga permiso de edición puede cargarlos.</p>':'')+'</div>';return;}
  if(!S.session){root.innerHTML=S.ui.publicPrivacy?demoBar()+'<main class="main public-main">'+vPrivacy(true)+'</main>':vLogin();save();window.scrollTo(0,0);return;}
  if(modeChoices().length>1&&!S.session.mode){root.innerHTML=vModeChoice();save();window.scrollTo(0,0);return;}
  if(S.session.must&&S.ui.view!=='misdatos'){flash('Por seguridad, cambia tu PIN provisional antes de continuar.','error');S.ui.view='misdatos';}
  else if(!S.session.must&&!signatureOf(S.session.eid)&&S.ui.view!=='privacidad'&&role()!=='hr'){S.ui.view='privacidad';}
  else if(!S.session.must&&role()==='employee'&&S.ui.view==='mivehiculo'&&!S.ui.vadded&&!S.ui.vregister&&vehicleState(S.session.eid)==='ok'){S.ui.view='inicio';}
  else if(!S.session.must&&role()==='employee'&&['privacidad','mivehiculo','recordatorio'].indexOf(S.ui.view)<0){var vs=vehicleState(S.session.eid);if(vs==='missing'){S.ui.vregister=false;S.ui.view='mivehiculo';}else if(vs==='reminder')S.ui.view='recordatorio';}
  var v=VIEWS[S.ui.view]||VIEWS.inicio;
  var html=v[1].indexOf(role())<0?'<h1>Sin permiso</h1><p class="muted">No tienes permisos para acceder a esta sección.</p>':v[0]();
  root.innerHTML=layout(tkBanner()+html);var cb=document.querySelector('.chat-body');if(cb)cb.scrollTop=cb.scrollHeight;
  document.querySelectorAll('[data-go]').forEach(function(a){if(a.getAttribute('data-go')===S.ui.view)a.classList.add('is-active');});
  save();if(scrollTop!==false)window.scrollTo(0,0);
  try{if(location.hash.slice(1)!==S.ui.view)history.replaceState(null,'','#'+S.ui.view);}catch(e){}
}

A.login=function(f,form){

  if(list.length>=MAX_FAILS){flash('Demasiados intentos fallidos. Espera '+LOCK_MIN+' minutos o pide a RRHH que restablezca tu PIN.','error');return render();}
  var btn=form&&form.querySelector('button');if(btn){btn.disabled=true;btn.textContent='Entrando…';}
  authPost('token?grant_type=password',{email:emailOf(no),password:pin}).then(function(j){keepAuth(j);return startSession();}).then(function(){
    delete S.fails[no];S.ui.view=S.session.must?'misdatos':'inicio';render();
  },function(e){

  if(WEAK.indexOf(f.pin)>=0||/^(\d)\1+$/.test(f.pin)){flash('Ese PIN es demasiado fácil de adivinar. Elige otro.','error');return render();}
  rpc('p_bootstrap',{p_no:f.employee_no.trim(),p_name:f.full_name.trim(),p_pin:f.pin}).then(function(){
    return authPost('token?grant_type=password',{email:emailOf(f.employee_no.trim()),password:f.pin});
  }).then(function(j){keepAuth(j);return startSession();}).then(function(){
    var u=me();if(u){u.must=0;}S.session.must=false;rpc('p_pin_changed').catch(function(){});
    flash('Cuenta de RR. HH. creada. Ya puedes dar de alta al resto del personal desde «Empleados».','success');go('empleados');

A.pin=function(f){

  if(!/^\d{6}$/.test(f.new_pin)||f.new_pin!==f.confirm_pin){flash('El nuevo PIN debe tener 6 cifras y coincidir.','error');return stay('cambiar-pin');}
  if(f.new_pin===f.old_pin){flash('El nuevo PIN debe ser distinto del actual.','error');return stay('cambiar-pin');}
  if(WEAK.indexOf(f.new_pin)>=0||/^(\d)\1+$/.test(f.new_pin)){flash('Ese PIN es demasiado fácil de adivinar. Elige otro.','error');return stay('cambiar-pin');}
  rpc('p_check_pin',{p_pin:f.old_pin}).then(function(ok){
    if(!ok){flash('El PIN actual no es correcto.','error');return stay('cambiar-pin');}
    return api('PUT','/auth/v1/user',{password:f.new_pin}).then(function(){return rpc('p_pin_changed');}).then(function(){
      u.must=0;known.employees&&known.employees.set('id:'+u.id,JSON.stringify(u));

      r.forEach(function(h,j){if(cNo<0&&/^(ID|N[O°º]?\.?|NUM\.?|NUMERO|N[O°º]?\.? ?(DE )?EMPLEADO|NUMERO (DE )?EMPLEADO|COD(IGO)?|COD\.? EMPLEADO)$/.test(h))cNo=j;else if(cName<0&&/NOMBRE/.test(h))cName=j;else if(cSec<0&&/GRUPO|SECCION|DEPARTAMENTO|SECCIO/.test(h))cSec=j;else if(cCat<0&&/CATEGOR/.test(h))cCat=j;else if(cCom<0&&/COMITE/.test(h))cCom=j;});

    if(hi<0){flash('No encuentro las columnas del número de empleado (ID) y del nombre (NOMBRE Y APELLIDOS) en la primera hoja.','error');return stay();}

      if(!no||!name||have[no]||seen[no])return;seen[no]=1;todo.push({no:no,name:name,center:cSec>=0?String(r[cSec]||'').trim():'',category:cCat>=0?String(r[cCat]||'').trim():'',com:cCom>=0&&/^(SI|SÍ|S|X|1|YES|COMITE|COMITÉ)$/i.test(String(r[cCom]||'').trim())});});
    if(!todo.length){flash('No hay personas nuevas en el Excel: todas tienen ya cuenta.','success');return stay();}

        .then(function(){done.push({no:t.no,name:t.name,pin:pin});},function(e){fail.push(t.no+' ('+(e.message||'error')+')');}).then(next);
    })();
    function fin(){IMPORT_CRED=done.slice();lastCredentials=done;
      flash(done.length+' cuenta'+(done.length===1?'':'s')+' creada'+(done.length===1?'':'s')+'. Imprime las fichas ahora: los PIN solo se ven esta vez.'+(fail.length?' No se pudieron crear: '+fail.join(', '):''),fail.length?'error':'success');stay();}

/* ---------- tickets como chat ---------- */
function msgTs(m){return +m.ts||Date.parse(m.created)||0;}
function tMine(){var u=me();if(!u)return [];var hr=role()==='hr';return S.tickets.filter(function(t){return hr||t.eid===u.id;});}
function tMsgs(tid){return S.tmsgs.filter(function(m){return m.tid===tid;}).sort(function(a,b){return msgTs(a)-msgTs(b);});}
function tRead(tid){var u=me();if(!u)return 0;var r=byId(S.treads,'tr-'+tid+'-'+u.id);return r?+r.at||0:0;}
function tUnread(t){var u=me();if(!u)return 0;var r=tRead(t.id);return S.tmsgs.filter(function(m){return m.tid===t.id&&m.sender!==u.id&&msgTs(m)>r;}).length;}
function tUnreadAll(){if(!S.session||!me())return 0;var r=role();if(r!=='hr'&&r!=='employee')return 0;return tMine().reduce(function(a,t){return a+tUnread(t);},0);}
function tLast(t){var ms=tMsgs(t.id);return ms.length?ms[ms.length-1]:null;}
function tMarkRead(tid){var u=me();if(!u)return;var id='tr-'+tid+'-'+u.id,r=byId(S.treads,id),last=tMsgs(tid).reduce(function(a,m){return Math.max(a,msgTs(m));},0),at=Math.max(Date.now(),last);
  if(r)r.at=at;else S.treads.push({id:id,tid:tid,eid:u.id,at:at});}
function hhmm(m){var d=new Date(msgTs(m));if(isNaN(d))return '';var t=pad(d.getHours())+':'+pad(d.getMinutes()),k=isoD(d);return k===isoD(today())?t:fDMY(k)+' '+t;}
