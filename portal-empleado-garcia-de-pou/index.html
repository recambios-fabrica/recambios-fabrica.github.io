.act-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--blue);padding-bottom:14px}.act-head .crest{background:var(--blue);color:#fff}.act-head div{display:grid}.act-head small{color:var(--muted);font-size:11px}.act-ref{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}

.act-decision.is-yes{border-color:#7cc497;background:#effaf3;color:#1e5e39}.act-decision.is-no{border-color:#e4a1a1;background:#fff4f4;color:#8b2323}

/* Foto o dibujo del vehículo */
.car-svg{width:100%;height:auto;display:block}
.vehicle-photo{object-fit:cover;border-radius:8px;background:#eef2f6;display:block}
.vehicle-drawing{display:grid;place-items:center;background:linear-gradient(180deg,#f3f7fb,#e6edf4);border-radius:8px;padding:4px 6px;text-align:center}
.vehicle-drawing small{display:none;font-size:10px;color:var(--muted)}
.thumb{width:84px;height:52px;flex-shrink:0}.vehicle-drawing.thumb{padding:2px 6px}
.big{width:100%;aspect-ratio:4/3}.vehicle-photo.big{height:auto}.vehicle-drawing.big{padding:20px}.vehicle-drawing.big small{display:block;margin-top:6px;font-size:11px}

.vehicle-match-meta{margin:2px 0 12px;color:#52657b;display:flex;align-items:center;gap:6px}
.color-dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid #33475b55}
.vehicle-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vehicle-match-grid div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}.vehicle-match-grid small{font-size:10px;font-weight:850;letter-spacing:.7px;color:#607d98}.vehicle-match-grid span{font-size:12px;color:var(--muted)}

/* Foto de referencia del modelo */
.vehicle-ref{margin:0;position:relative;display:block}.vehicle-ref .vehicle-photo{width:100%;height:100%;object-fit:cover}
.vehicle-ref figcaption{position:absolute;left:0;right:0;bottom:0;background:#0d243dcc;color:#fff;font-size:9px;line-height:1.3;padding:3px 5px;border-radius:0 0 8px 8px}

.vehicle-ref.thumb figcaption{font-size:0;padding:0;height:4px;background:#e8a33a}.vehicle-ref.thumb::after{content:"REF.";position:absolute;top:3px;left:3px;font-size:8px;font-weight:900;background:#e8a33a;color:#fff;padding:1px 3px;border-radius:3px}
.vehicle-ref.big figcaption{font-size:12px;padding:8px 10px}
.vehicle-ref-note{margin:0 14px 10px;padding:9px 11px;border-radius:8px;background:#fff8e9;border:1px solid #f1e1bd;color:#795d2b;font-size:12px}
.vehicle-year{font-size:16px;color:#52657b;font-weight:700;background:#edf3f9;padding:2px 8px;border-radius:6px;vertical-align:middle}
.vehicle-form{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ===== Aspecto profesional ===== */
:root{--blue:#133f6e;--blue2:#1d5a94;--accent:#2f7de1;--bg:#f4f6fa;--text:#16243a;--muted:#6b778a;--line:#e3e8ef;--card-sh:0 1px 2px rgba(16,35,60,.05),0 4px 16px rgba(16,35,60,.05)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg)!important;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;color:#10294a}
h2{font-weight:650;letter-spacing:-.01em;color:#10294a}
/* menú lateral */
.sidebar{background:linear-gradient(180deg,#123b67 0%,#0f2f53 100%);padding:20px 12px;box-shadow:1px 0 0 rgba(255,255,255,.04)}
.sidebar .brand{margin:2px 8px 22px;font-size:12.5px;letter-spacing:1.4px;font-weight:700;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar .crest{width:34px;height:38px;font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sidebar nav{gap:2px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#c9d7e8;transition:background .15s,color .15s}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a.is-active,nav a.active,nav a[aria-current]{background:rgba(255,255,255,.12)!important;color:#fff!important;box-shadow:inset 3px 0 0 #6fb1ff}
.nic{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
nav a .badge-amber,nav a .badge-red{margin-left:auto}
.nav-switch{border-top:1px solid rgba(255,255,255,.1);border-radius:0!important;margin-top:6px;padding-top:12px!important;color:#9fc3ee!important;font-size:13px!important}
.logout{border-color:rgba(255,255,255,.22)!important;border-radius:9px;font-weight:600;font-size:13.5px;color:#dbe6f3!important}
.logout:hover{background:rgba(255,255,255,.08)}
/* barra superior */
.topbar{background:rgba(255,255,255,.85);backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 18px;margin-bottom:24px;box-shadow:var(--card-sh);position:sticky;top:12px;z-index:20}
.topbar>span:first-child{font-weight:650;color:#10294a;font-size:14px}
.uchip{display:inline-flex;align-items:center;gap:10px}
.uchip>i{font-style:normal;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2f7de1,#133f6e);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px}
.uchip-t{display:flex;flex-direction:column;line-height:1.2;text-align:left}.uchip-t b{color:#16243a;font-size:13.5px;font-weight:600}.uchip-t em{font-style:normal;font-size:10.5px;letter-spacing:.8px;color:var(--muted);font-weight:600}
.lang-pick select{border-radius:999px;padding:6px 10px;font-size:13px;border-color:var(--line);background:#f7f9fc;width:auto}
/* tarjetas, botones, campos */
.card,section.card{border-color:var(--line);border-radius:14px;box-shadow:var(--card-sh)}
button{border-radius:9px;font-weight:600;transition:filter .15s,box-shadow .15s,transform .05s}
button:hover{filter:brightness(.97)}button:active{transform:translateY(1px)}
.primary,button.primary{background:linear-gradient(180deg,#1d5a94,#133f6e);color:#fff;box-shadow:0 1px 2px rgba(19,63,110,.25)}
.primary:hover{filter:brightness(1.07)}
input,select,textarea{border-radius:9px;border-color:#d6dee9;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2f7de1;box-shadow:0 0 0 3px rgba(47,125,225,.15)}
.flash{border-radius:12px;border:1px solid rgba(0,0,0,.04)}
.chip{border-radius:999px;font-weight:600}
.vac-table th,.table-wrap th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#f8fafc}
.vac-table tr:hover td{background:#fafcff}
/* entrada */
.login-card{border-radius:18px;box-shadow:0 20px 60px rgba(8,28,52,.28);padding:38px 34px}
.login-card h1{font-size:25px}
.login-card .primary.full{padding:13px;font-size:15.5px}

var VAC_DEFAULT=22, VAC_AUTO_FROM=2026; // días laborables por año; el arrastre automático empieza con los datos de 2026
function vacOffDays(){var m={};S.events.forEach(function(e){if(e.type==='Festivo'||e.type==='Vacaciones empresa')m[e.date]=1;});return m;}
function isWorkDay(k,off){var d=new Date(k+'T12:00:00'),w=d.getDay();return w!==0&&w!==6&&!off[k];}
function vacDaysOf(l,year,off){var n=0,d=new Date(l.start+'T12:00:00'),e=new Date(l.end+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1)){var k=isoD(d);if(year&&+k.slice(0,4)!==year)continue;if(isWorkDay(k,off))n++;}return n;}
function vacAnual(u){var v=+(u&&u.vacAnual);return v>0?v:VAC_DEFAULT;}
function vacInfo(u,year){var off=vacOffDays(),used=0,pend=0;
  S.leaves.forEach(function(l){if(l.eid!==u.id||l.kind!=='Vacaciones')return;if(l.start.slice(0,4)>String(year)||l.end.slice(0,4)<String(year))return;var n=vacDaysOf(l,year,off);if(l.status==='Aprobada')used+=n;else if(l.status==='Pendiente')pend+=n;});
  var prev=0,man=u.vacPrev&&u.vacPrev[String(year)];
  if(man!=null&&man!=='')prev=+man;else if(year-1>=VAC_AUTO_FROM){var p=vacInfo(u,year-1);prev=Math.max(0,p.left);}
  var tot=vacAnual(u);return {year:year,anual:tot,prev:prev,used:used,pend:pend,left:tot+prev-used-pend};}
function vacDayMap(u){var m={},off=vacOffDays();S.leaves.forEach(function(l){if(l.eid!==u.id||l.kind!=='Vacaciones'||(l.status!=='Aprobada'&&l.status!=='Pendiente'))return;var d=new Date(l.start+'T12:00:00'),e=new Date(l.end+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1)){var k=isoD(d);if(isWorkDay(k,off))m[k]=l.status==='Aprobada'?'ok':'pend';}});return m;}

// Fotos guardadas como archivos (/_blob/…): se piden con fetch, que funciona tanto en Claude como con el adaptador de Supabase.
var BLOBS={};
function imgAttr(u){u=String(u||'');return /^\/_blob\//.test(u)?'data-blob="'+esc(u)+'" src="'+(BLOBS[u]||'data:image/gif;base64,R0lGODlhAQABAAAAACw=')+'"':'src="'+esc(u)+'"';}
function hydrateBlobs(){document.querySelectorAll('img[data-blob]').forEach(function(img){var u=img.getAttribute('data-blob');if(BLOBS[u]){img.src=BLOBS[u];return;}if(BLOBS[u]===false)return;BLOBS[u]=false;
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){BLOBS[u]=URL.createObjectURL(b);document.querySelectorAll('img[data-blob="'+u+'"]').forEach(function(i){i.src=BLOBS[u];});},function(){delete BLOBS[u];});});}
new MutationObserver(function(){hydrateBlobs();}).observe(document.documentElement,{childList:true,subtree:true});
function storeImage(canvas,quality,cb){
  // La foto se guarda en el almacén: en la carpeta de la persona (vehículos) o en la pública (noticias de RR. HH. / comité).
  var folder=(role()==='hr'||role()==='committee')?'pub':String(S.session.eid);

function render(scrollTop){
  var root=document.getElementById('app');
  if(MODE==='loading'){root.innerHTML='<div class="demo-state"><div class="crest big">G</div><h1>Portal del empleado</h1><p class="muted">Cargando…</p></div>';return;}
  if(MODE==='offline'){root.innerHTML='<div class="demo-state"><div class="crest big">G</div><h1>No se puede conectar</h1><p class="muted">Ahora mismo no se puede conectar con el servidor del portal. Comprueba la conexión e inténtalo más tarde.</p><button class="primary" onclick="location.reload()">Reintentar</button></div>';return;}
  if(MODE==='setup'){root.innerHTML=vSetup();return;}
  if(MODE==='empty'){root.innerHTML='<div class="demo-state"><div class="crest big">G</div><h1>Demo compartida sin datos</h1><p class="muted">Todavía no hay datos de ejemplo. Cárgalos para que todos los que abran la página vean lo mismo.</p><button class="primary" data-act="seedshared">Cargar datos de ejemplo</button>'+(readOnly?'<p class="flash error">Solo el propietario o quien tenga permiso de edición puede cargarlos.</p>':'')+'</div>';return;}
  if(!S.session){root.innerHTML=S.ui.publicPrivacy?demoBar()+'<main class="main public-main">'+vPrivacy(true)+'</main>':vLogin();save();window.scrollTo(0,0);return;}
  if(modeChoices().length>1&&!S.session.mode){root.innerHTML=vModeChoice();save();window.scrollTo(0,0);return;}
  if(S.session.must&&S.ui.view!=='misdatos'){flash('Por seguridad, cambia tu PIN provisional antes de continuar.','error');S.ui.view='misdatos';}
  else if(!S.session.must&&!signatureOf(S.session.eid)&&S.ui.view!=='privacidad'&&role()!=='hr'){S.ui.view='privacidad';}
  else if(!S.session.must&&role()==='employee'&&S.ui.view==='mivehiculo'&&!S.ui.vadded&&!S.ui.vregister&&vehicleState(S.session.eid)==='ok'){S.ui.view='inicio';}
  else if(!S.session.must&&role()==='employee'&&['privacidad','mivehiculo','recordatorio'].indexOf(S.ui.view)<0){var vs=vehicleState(S.session.eid);if(vs==='missing'){S.ui.vregister=false;S.ui.view='mivehiculo';}else if(vs==='reminder')S.ui.view='recordatorio';}
  var v=VIEWS[S.ui.view]||VIEWS.inicio;
  var html=v[1].indexOf(role())<0?'<h1>Sin permiso</h1><p class="muted">No tienes permisos para acceder a esta sección.</p>':v[0]();
  root.innerHTML=layout(tkBanner()+html);var cb=document.querySelector('.chat-body');if(cb)cb.scrollTop=cb.scrollHeight;
  document.querySelectorAll('[data-go]').forEach(function(a){if(a.getAttribute('data-go')===S.ui.view)a.classList.add('is-active');});
  save();if(scrollTop!==false)window.scrollTo(0,0);
  try{if(location.hash.slice(1)!==S.ui.view)history.replaceState(null,'','#'+S.ui.view);}catch(e){}
}
function go(view){S.ui.view=view;render();}
function stay(anchor){render(false);if(anchor){var el=document.getElementById(anchor);if(el)el.scrollIntoView({block:'start'});}}

A.login=function(f,form){
  var no=f.employee_no.trim(),pin=f.pin.trim(),now=Date.now(),list=(S.fails[no]||[]).filter(function(t){return now-t<LOCK_MIN*60000;});
  if(list.length>=MAX_FAILS){flash('Demasiados intentos fallidos. Espera '+LOCK_MIN+' minutos o pide a RRHH que restablezca tu PIN.','error');return render();}
  var btn=form&&form.querySelector('button');if(btn){btn.disabled=true;btn.textContent='Entrando…';}
  authPost('token?grant_type=password',{email:emailOf(no),password:pin}).then(function(j){keepAuth(j);return startSession();}).then(function(){
    delete S.fails[no];S.ui.view=S.session.must?'misdatos':'inicio';render();
  },function(e){

var LEAVE_KINDS=['Vacaciones','Asuntos propios','Permiso retribuido','Baja médica','Cita médica','Otros'];

/* ---------- tickets como chat ---------- */
function msgTs(m){return +m.ts||Date.parse(m.created)||0;}
function tMine(){var u=me();if(!u)return [];var hr=role()==='hr';return S.tickets.filter(function(t){return hr||t.eid===u.id;});}
function tMsgs(tid){return S.tmsgs.filter(function(m){return m.tid===tid;}).sort(function(a,b){return msgTs(a)-msgTs(b);});}
function tRead(tid){var u=me();if(!u)return 0;var r=byId(S.treads,'tr-'+tid+'-'+u.id);return r?+r.at||0:0;}
function tUnread(t){var u=me();if(!u)return 0;var r=tRead(t.id);return S.tmsgs.filter(function(m){return m.tid===t.id&&m.sender!==u.id&&msgTs(m)>r;}).length;}
function tUnreadAll(){if(!S.session||!me())return 0;var r=role();if(r!=='hr'&&r!=='employee')return 0;return tMine().reduce(function(a,t){return a+tUnread(t);},0);}
function tLast(t){var ms=tMsgs(t.id);return ms.length?ms[ms.length-1]:null;}
function tMarkRead(tid){var u=me();if(!u)return;var id='tr-'+tid+'-'+u.id,r=byId(S.treads,id),last=tMsgs(tid).reduce(function(a,m){return Math.max(a,msgTs(m));},0),at=Math.max(Date.now(),last);
  if(r)r.at=at;else S.treads.push({id:id,tid:tid,eid:u.id,at:at});}
function hhmm(m){var d=new Date(msgTs(m));if(isNaN(d))return '';var t=pad(d.getHours())+':'+pad(d.getMinutes()),k=isoD(d);return k===isoD(today())?t:fDMY(k)+' '+t;}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function tkLink(){var n=tUnreadAll();try{document.title=(n?'('+n+') ':'')+'Portal del empleado · García de Pou';}catch(e){}

/* las fotos del móvil se reducen (máx. 1800 px) para que suban rápido; los PDF van tal cual */
function tShrink(file){return new Promise(function(res){
  if(!/^image\/(jpeg|png|webp|heic|heif)/i.test(file.type)||file.size<700*1024)return res(file);
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file);},'image/jpeg',0.85);};
  img.onerror=function(){URL.revokeObjectURL(u);res(file);};img.src=u;});}
function tUpload(folder,files){files=[].slice.call(files||[]);
  if(files.length>TFILE_MAX)return Promise.reject(new Error('Como máximo '+TFILE_MAX+' adjuntos por mensaje.'));
  for(var i=0;i<files.length;i++){var f=files[i];if(!/^image\//.test(f.type)&&!/\.pdf$/i.test(f.name))return Promise.reject(new Error('Solo se pueden adjuntar fotos o PDF.'));if(f.size>20*1024*1024)return Promise.reject(new Error('«'+f.name+'» es demasiado grande (máx. 20 MB).'));}
  return Promise.all(files.map(function(f){return tShrink(f).then(function(g){var pdf=/\.pdf$/i.test(f.name);
    return storagePut(folder,g,pdf?'.pdf':'.jpg').then(function(path){return {path:path,name:f.name,type:pdf?'application/pdf':'image/jpeg'};});});}));}
function tBusy(form,on){var b=form&&form.querySelector('button.primary');if(b){b.disabled=on;b.textContent=on?'Subiendo…':'Enviar';}}

function nrm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

function empFiltered(rows){var q=nrm(S.ui.empQ).trim(),sec=S.ui.empSec||'',st=S.ui.empSt||'';
  var words=q?q.split(/\s+/):[];
  return rows.filter(function(e){
    if(sec&&secNorm(e.center)!==secNorm(sec)&&!(sec==='__none'&&!e.center))return false;
    if(st==='act'&&!e.active)return false;if(st==='off'&&e.active)return false;
    if(st==='nosign'&&signatureOf(e.id))return false;if(st==='comm'&&e.role!=='committee')return false;if(st==='scope'&&!((e.supSecs||[]).length||(e.dirSecs||[]).length))return false;
    if(!words.length)return true;var h=nrm([e.name,e.no,e.center,e.category].join(' '));return words.every(function(w){return h.indexOf(w)>=0;});});}

/* ===== 25) Un cambio en la ficha del empleado se aplica en todo el portal =====
   Casi todo se calcula al momento a partir de la ficha (Plantilla hoy, calendario, turnos, ausencias, sábados, buscadores).
   Lo que se guarda aparte y aquí se mantiene al día: nombres del organigrama, accesos de directores/encargados por sección
   y los datos ya cargados en pantalla. */
function empChanged(){S._abs=null;S._absP=null;S._absM=null;S._absR=null;}
function orgRename(oldN,newN){oldN=String(oldN||'').trim();newN=String(newN||'').trim();if(!oldN||!newN||oldN===newN||!(S.org&&S.org.length))return 0;var n=0,k=nTok(oldN).join(' ');
  S.org.forEach(function(o){var parts=String(o.name||'').split(/\s*[;\n]\s*/);var ch=false;parts=parts.map(function(p){if(p&&nTok(p).join(' ')===k){ch=true;return newN;}return p;});if(ch){o.name=parts.join('; ');n++;}});return n;}
/* renombrar o eliminar una sección: también en los accesos de directores y encargados */
function scopesRename(oldS,newS){var ko=secNorm(oldS),jobs=[];
  S.employees.forEach(function(e){var sup=(e.supSecs||[]).slice(),dir=(e.dirSecs||[]).slice(),ch=false;
    function fix(a){var out=[];a.forEach(function(x){if(secNorm(x)===ko){ch=true;if(newS&&out.map(secNorm).indexOf(secNorm(newS))<0)out.push(newS);}else if(out.map(secNorm).indexOf(secNorm(x))<0)out.push(x);});return out;}
    sup=fix(sup);dir=fix(dir);if(ch)jobs.push({e:e,sup:sup,dir:dir});});
  if(!jobs.length)return Promise.resolve(0);
  return jobs.reduce(function(p,j){return p.then(function(){return rpc('p_set_scopes',{p_target:j.e.id,p_sup:j.sup,p_dir:j.dir});});},Promise.resolve())
    .then(function(){return fullLoad();}).then(function(){return jobs.length;});}
A.empdata=function(f,form){var e=byId(S.employees,+form.dataset.id);if(!e)return stay();
  var nm=String(f.ename==null?e.name:f.ename).trim().replace(/\s+/g,' '),cat=String(f.category||'').trim(),cen=String(f.center||'').trim();
  if(!nm){flash('El nombre no puede quedar vacío.','error');return stay();}
  var msg=[],oldN=e.name,oldC=e.center;
  if(nm!==oldN){e.name=nm;var o=orgRename(oldN,nm);msg.push('nombre'+(o?' (también en el organigrama)':''));}
  if(cat!==(e.category||'')){e.category=cat;msg.push('categoría');}
  if(String(cen||'').trim()!==String(oldC||'').trim()){e.center=cen;msg.push('sección: '+(oldC||'—')+' → '+(cen||'—'));}
  empChanged();
  flash(msg.length?'Guardado ('+msg.join(', ')+'). Ya sale así en Plantilla hoy, turnos, ausencias, sábados y en lo que ve su encargado y su director.':'No había cambios.','success');stay();};

function asisMd(s){var h=esc(s);
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  var L=h.split('\n'),o='',inl=false;
  L.forEach(function(l){var m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if(m){if(!inl){o+='<ul>';inl=true;}o+='<li>'+m[1]+'</li>';}
    else{if(inl){o+='</ul>';inl=false;}if(/^\s*\|/.test(l)){o+='<div class="asis-row">'+l.replace(/^\s*\||\|\s*$/g,'').split('|').map(function(c){return '<span>'+c.trim()+'</span>';}).join('')+'</div>';}
      else if(/^\s*#{1,4}\s/.test(l))o+='<b>'+l.replace(/^\s*#+\s*/,'')+'</b><br>';else if(l.trim())o+=l+'<br>';else o+='<br>';}});
  if(inl)o+='</ul>';
  return o.replace(/<div class="asis-row">(<span>[\s:-]*<\/span>)+<\/div>/g,'').replace(/(<br>){2,}/g,'<br>').replace(/<br>$/,'');}

  if(!f.employee_id||!String(f.title||'').trim()||!f.completed_on){flash('Indica trabajador, formación y fecha de realización.','error');return stay();}
  if(!f.hours||!String(f.content||'').trim()||!String(f.trainer||'').trim()){flash('Indica las horas, el contenido y quién la ha impartido.','error');return stay();}
  S.trainings.push({id:nextId(),eid:+f.employee_id,title:f.title.trim(),done:f.completed_on,expires:f.expires_on||'',status:'Completada',notes:String(f.notes||'').trim(),
    hours:+f.hours,mode:f.mode||'',content:f.content.trim(),trainer:f.trainer.trim(),kind:f.kind||'',in_hours:f.in_hours?1:0,created:nowStr()});
  flash('Formación añadida. El trabajador la verá para firmar que la ha recibido.','success');stay();};
function trMine(){var u=me()||{};return (S.trainings||[]).filter(function(t){return +t.eid===+u.id;}).sort(function(a,b){return String(b.done).localeCompare(String(a.done));});}
function trPending(){var r=role();if(r!=='employee'&&r!=='committee')return [];return trMine().filter(function(t){return !t.sign&&t.content;});}
function trSigLine(t){var s=t.sign;return s?'Firmado electrónicamente por '+(s.name||'')+' · Nº de operario '+(s.no||'')+' · '+fDMY(String(s.at).slice(0,10))+' a las '+String(s.at).slice(11,16):'';}
function trCard(t){return '<section class="card" id="tr-'+t.id+'"><span class="medical-badge">🎓 FORMACIÓN</span><h2>'+esc(t.title)+'</h2>'+
  '<table class="act-data"><tr><th>Fecha</th><td>'+esc(fDMY(t.done))+'</td></tr><tr><th>Horas</th><td>'+esc(String(t.hours||''))+'</td></tr><tr><th>Modalidad</th><td>'+esc(t.mode||'')+'</td></tr><tr><th>Tipo</th><td>'+esc(t.kind||'')+'</td></tr><tr><th>Impartida por</th><td>'+esc(t.trainer||'')+'</td></tr><tr><th>Contenido</th><td>'+esc(t.content||'').replace(/\n/g,'<br>')+'</td></tr></table>'+
  (t.sign?'<p class="muted">✅ <span class="no-tr">'+esc(trSigLine(t))+'</span></p>':
  '<form data-a="trsign" data-id="'+t.id+'" class="epi-ack"><label class="check"><input type="checkbox" name="read" required> <span>He recibido esta formación en materia de prevención de riesgos laborales, adecuada a mi puesto de trabajo.</span></label>'+epiSignFields('tr-pin-'+t.id)+'<button class="primary">Firmar</button></form>')+'</section>';}
A.trsign=function(f,form){var id=+form.dataset.id;if(!form.querySelector('[name=read]').checked){flash('Marca la casilla para confirmar que has recibido la formación.','error');return stay('tr-'+id);}
  rpc('p_training_sign',{p_id:id,p_no:f.eno||'',p_pin:f.pin||''}).then(function(d){localPut('trainings',d);flash('Formación firmada.','success');stay();},function(e){flash('No se ha podido firmar: '+((e&&e.message)||e),'error');stay('tr-'+id);});};

  var emp=function(id){return byId(S.employees,id)||{};},wb=XLSX.utils.book_new(),add=function(n,r){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{'Sin registros':''}]),n);};

    'Solicitud firmada':String(e.req_at||'').replace('T',' '),'Estado':e.status,'Entregado por':e.deliv_by||'','Entregado el':String(e.deliv_at||'').replace('T',' '),'Acuse firmado':String(e.rec_at||'').replace('T',' '),'Código acuse':e.rec_hash?String(e.rec_hash).slice(0,16):''};return o;}));

  add('Reconocimientos',(S.consents||[]).map(function(k){var c=byId(S.campaigns,k.cid)||{},e=emp(k.eid);return {'Campaña':c.title||'','Servicio de prevención':c.provider||'','Nº de operario':e.no||'','Nombre':e.name||'','Decisión':k.decision==='renuncio'?'Renuncia voluntaria':'Autoriza','Firmado':String(k.srv_at||k.at||'').replace('T',' '),'Código':k.hash?String(k.hash).slice(0,16):''};}));
  add('Documentos firmados',(S.sdsigs||[]).map(function(x){var d=byId(S.sdocs,x.did)||{},e=emp(x.eid);return {'Documento':d.title||x.title||'','Nº de operario':e.no||'','Nombre':e.name||'','Firmado':String(x.srv_at||x.at||'').replace('T',' '),'Código':x.hash?String(x.hash).slice(0,16):''};}));
  XLSX.writeFile(wb,'registro-prevencion-'+isoD(today())+'.xlsx');flash('Descargado. Contiene EPIs, formación, reconocimientos (solo la decisión, nunca datos de salud) y documentos firmados.','success');stay();};

var CAE_AUT=[['cert_ss','Certificado de estar al corriente con la Seguridad Social'],['aeat','Certificado de estar al corriente con la AEAT (Hacienda)'],['reta','Justificante de alta de autónomo en el RETA'],['recibo','Recibo actualizado de autónomos'],['segacc','Seguro de accidentes / convenio'],['rc','Seguro de responsabilidad civil']];
function caeDocs(c){return (c&&c.type==='autonomo'?CAE_AUT:CAE_EMP).concat(CAE_PRL);}
function caeAll(){return (S.cae||[]).filter(function(c){return c.active!==0;}).sort(function(a,b){return String(a.name).localeCompare(String(b.name));});}
function caeDocSt(c,k){var d=(c.docs||{})[k]||{};if(!(d.files||[]).length)return 'falta';if(d.exp&&d.exp<prToday())return 'caducado';if(d.exp&&d.exp<=prIn(30))return 'caduca';return 'ok';}
function caeOk(c){return caeDocs(c).every(function(d){var s=caeDocSt(c,d[0]);return s==='ok'||s==='caduca';});}
function caeChip(s){return s==='ok'?'<span class="chip chip-ok">Al día</span>':s==='caduca'?'<span class="chip chip-wait">Caduca pronto</span>':s==='caducado'?'<span class="chip chip-no">Caducado</span>':'<span class="chip chip-no">Falta</span>';}
function caeAlerts(){var n=0;caeAll().forEach(function(c){caeDocs(c).forEach(function(d){if(caeDocSt(c,d[0])!=='ok')n++;});});return n;}
function caeForm(c){c=c||{};return '<form data-a="caesave"'+(c.id?' data-id="'+c.id+'"':'')+'><label>Tipo</label><select name="type"><option value="empresa"'+(c.type!=='autonomo'?' selected':'')+'>Empresa con trabajadores</option><option value="autonomo"'+(c.type==='autonomo'?' selected':'')+'>Autónomo</option></select><div class="grid two"><div><label>Empresa</label><input name="name" required maxlength="120" value="'+esc(c.name||'')+'"></div><div><label>CIF</label><input name="cif" maxlength="20" value="'+esc(c.cif||'')+'"></div></div>'+
  '<label>Qué trabajos hace en la fábrica</label><input name="activity" maxlength="200" value="'+esc(c.activity||'')+'" placeholder="Ej. mantenimiento de compresores">'+
  '<div class="grid two"><div><label>Persona de contacto</label><input name="contact" maxlength="80" value="'+esc(c.contact||'')+'"></div><div><label>Teléfono o correo</label><input name="phone" maxlength="80" value="'+esc(c.phone||'')+'"></div></div>'+
  '<div class="grid two"><div><label>Trabaja desde</label><input type="date" name="from" value="'+esc(c.from||'')+'"></div><div><label>Hasta</label><input type="date" name="to" value="'+esc(c.to||'')+'"></div></div>'+
  '<label>Sus trabajadores que entran (uno por línea)</label><textarea name="workers" rows="3" maxlength="2000">'+esc(c.workers||'')+'</textarea>'+
  '<label>Riesgos de la fábrica y normas entregados el</label><input type="date" name="normas" value="'+esc(c.normas||'')+'">'+

var INS_TPL=['Orden y limpieza en pasillos y puestos','Salidas y recorridos de evacuación libres y señalizados','Extintores y BIE accesibles, señalizados y revisados','Protecciones y resguardos de las máquinas colocados','Paradas de emergencia funcionan','EPIs obligatorios en uso','Cuadros eléctricos cerrados y sin daños','Carretillas: revisión diaria y circulación correcta','Almacenamiento estable y a la altura correcta','Productos químicos etiquetados y con ficha de seguridad','Botiquín completo','Señalización de seguridad visible'];

function insCard(x){var op=+S.ui.insOpen===+x.id,its=x.items||[],ok=its.filter(function(i){return i.v==='ok';}).length,no=its.filter(function(i){return i.v==='no';}).length;

  (x.kind==='sim'?'<table class="pr-tbl"><tr><th>Tipo</th><td class="no-tr">'+esc(x.stype)+'</td></tr><tr><th>Hora de inicio</th><td>'+esc(x.start||'–')+'</td></tr><tr><th>Tiempo de evacuación</th><td>'+esc(x.mins||'–')+' min</td></tr><tr><th>Personas</th><td>'+esc(x.people||'–')+'</td></tr><tr><th>Incidencias</th><td class="no-tr">'+esc(x.issues||'–')+'</td></tr><tr><th>Mejoras</th><td class="no-tr">'+esc(x.improve||'–')+'</td></tr></table>':

var NT_KIND={comunicado:'📢 Comunicado',charla:'🗣️ Charla informativa',protocolo:'🚨 Protocolo de emergencia'};

 {kind:'protocolo',title:'Qué hacer en caso de fuego o incendio',aud:'all',qs:[],body:'# 1. Detección\n- Mantén la calma.\n- Si ves humo, fuego u olor a quemado, avisa enseguida.\n- Di el lugar exacto donde está el fuego.\n# 2. Aviso de emergencia\n- Llama al 112 si hay fuego, humo o peligro para las personas.\n- Avisa a tu responsable para activar el protocolo interno de emergencia.\n- Explica claramente dónde es y qué pasa.\n# 3. Proteger a las personas\n- Evacúa siguiendo las instrucciones de emergencia.\n- Ve al punto de reunión.\n- No uses los ascensores.\n- No vuelvas a por tus cosas.\n- No dejes entrar a nadie en la zona afectada.\n# 4. Desde la garita\n- Avisar a los responsables.\n- Facilitar el acceso a los servicios de emergencia, si es seguro.\n- Informar de dónde está el incendio y de los riesgos conocidos.\n- No abandonar la garita si eso supone ponerse en peligro.\n# 5. Extintores\n- Solo intenta apagar un fuego pequeño si estás formado, tienes el extintor adecuado y una salida segura.\n- Si el fuego crece o hay mucho humo, aléjate y evacúa.\n- No pongas en riesgo tu vida ni la de otros.\n# 6. Final de la emergencia\n- Espera las instrucciones de los servicios de emergencia o del responsable.\n- No vuelvas a entrar hasta que te lo autoricen.\n# Normas importantes\n- Ante humo o fuego, avisa al 112 sin esperar.\n- No te enfrentes a un incendio que no puedas controlar con seguridad.\n- Nunca vuelvas a una zona evacuada sin autorización.'},
 {kind:'protocolo',title:'Alerta roja por lluvias: qué hacer',aud:'all',qs:[],body:'Cuando las autoridades (AEMET o Protección Civil) declaran alerta roja por lluvias, la empresa activa el Plan de Autoprotección. Es un riesgo grave e inminente (art. 21 de la Ley 31/1995).\n# Qué pasa\n- No hay que venir al centro de trabajo mientras dure la alerta.\n- Se suspende la actividad productiva normal.\n- La ausencia es justificada.\n- Solo se mantienen servicios mínimos por seguridad, con evaluación de riesgos previa.\n# Qué tienes que hacer\n- Atiende los avisos del portal y de tu responsable.\n- No te desplaces al centro de trabajo.\n- Si ya estás en el centro, sigue las instrucciones del responsable de la emergencia.\n# Vuelta al trabajo\n- Solo cuando se haya desactivado la alerta oficialmente, se hayan revisado las instalaciones y prevención lo haya validado.\n- La empresa avisará de forma oficial de la vuelta a la actividad.'},
 {kind:'protocolo',title:'⚠️ ACTIVADO: alerta roja por lluvias',aud:'all',urgent:1,qs:[],body:'Ante la alerta roja por lluvias emitida por las autoridades competentes, se activa el Plan de Autoprotección y el procedimiento de prevención correspondiente.\n- Queda prohibido el acceso al centro de trabajo mientras permanezca activa la alerta.\n- La no asistencia tendrá carácter de ausencia justificada.\n- Se informará del restablecimiento de la actividad una vez verificadas las condiciones de seguridad.\nLa Dirección · García de Pou'},
 {kind:'comunicado',title:'Protecciones de las máquinas',aud:'sups',qs:[],body:'Att. Encargados y Mantenimiento.\nEs obligatorio mantener las protecciones de las máquinas CERRADAS Y CONECTADAS o COLOCADAS según corresponda.\n# Inicio y final de turno / tras mantenimiento\n- Después de cualquier actuación (mantenimiento interno o externo, encargados, jefe de equipo, ajustes o reparaciones) hay que dejar todas las protecciones cerradas, conectadas y las tapas colocadas antes de dar el trabajo por terminado.\n# Verificación antes de la puesta en marcha\n- Los encargados comprobarán al inicio de la jornada y tras cada intervención que las máquinas tienen todas sus protecciones.\n- No se pondrá ninguna máquina en marcha sin sus protecciones.\n# Parada inmediata\n- Si se detecta a alguien trabajando con una protección retirada, inutilizada o un armario eléctrico abierto, se PARARÁN los trabajos de inmediato.\n- No se reanudará hasta que el puesto vuelva a estar en condiciones de seguridad.'},
 {kind:'charla',title:'Polvo de papel y ruido: información de riesgos',aud:'secs',qs:['¿Qué riesgo te preocupa más en tu día a día?','Si pudieras cambiar algo para trabajar más seguro, ¿qué sería?'],body:'«No he venido a decir lo que hacéis mal, sino a escuchar qué os dificulta trabajar seguros y cómo podemos mejorarlo».\n# Puestos afectados\n- Operarios de fabricación y manipulado de papel.\n- Limpieza y mantenimiento.\n# Polvo de papel\n- Irritación de nariz, garganta y vías respiratorias.\n- Tos frecuente y dificultad para respirar.\n- Rinitis y bronquitis crónica si la exposición es larga.\n- Puede empeorar el asma u otras enfermedades respiratorias.\n# Ruido\n- Zumbidos o pitidos en los oídos.\n- Dolor de cabeza.\n- Pérdida de audición temporal o permanente.\n- Aumento de la tensión arterial y problemas de sueño.\n# EPIs obligatorios\n- Mascarilla.\n- Tapones auditivos.\nNo usarlos es una infracción de las normas de seguridad y puede dar lugar a sanciones.\n# Tus obligaciones\n- Usar bien y siempre los EPIs que te dan.\n- Cumplir los procedimientos y normas de trabajo.\n- Avisar de cualquier situación de riesgo.\n«La empresa debe poner medios, pero la última decisión de protegerse es de cada uno. Si algo no funciona, decidlo».\nLa firma solo acredita la asistencia y la información recibida; no supone sanción ni responsabilidad disciplinaria.'}];

function rsCl(x,a,b){return Math.max(a,Math.min(b,x));}
function rsLevel(s){return s<=1?['Inapreciable','No es necesaria actuación','chip-ok']:s<=4?['Mejorable','Pueden mejorarse algunos elementos del puesto','chip-ok']:s===5?['Alto','Es necesaria la actuación','chip-wait']:s<=8?['Muy alto','Es necesaria la actuación cuanto antes','chip-no']:['Extremo','Es necesaria la actuación urgentemente','chip-no'];}
function rsCalc(v){var t=function(k){return +v['t'+k]||0;};

  var B=RS_B[ph][mon],Cc=RS_C[mou][kb],Dd=Math.max(B,Cc),s=rsCl(Math.max(chair,Dd),1,10),L=rsLevel(s);
  return {chair:chair,monitor:mon,phone:ph,mouse:mou,keyboard:kb,B:B,C:Cc,D:Dd,score:s,level:L[0],action:L[1],cls:L[2]};}
/* Snook-Ciriello */
function snCalc(v){var n=function(k){return parseFloat(String(v[k]||'').replace(',','.'))||0;};var p=n('pma');
  if(v.interp==='on'||v.interp===1){var d=n('d'),d1=n('d1'),d2=n('d2'),p1=n('p1'),p2=n('p2');p=(d2!==d1)?p1+(p2-p1)*(d-d1)/(d2-d1):Math.min(p1,p2);}
  var pc=p*(v.noasa==='on'||v.noasa===1?0.85:1)*(v.lejos==='on'||v.lejos===1?0.5:1),w=n('peso'),r=pc?w/pc:0;pc=Math.round(pc*10)/10;
  var L=!pc||!w?['—','Rellena el peso máximo de la tabla y el peso real','chip']:r<=1?['Aceptable','El peso real no supera el peso máximo aceptable','chip-ok']:r<=1.25?['Por encima','El peso real supera el máximo aceptable: conviene mejorar la tarea','chip-wait']:['Muy por encima','El peso real supera claramente el máximo aceptable: hay que actuar','chip-no'];
  return {pma:Math.round(p*10)/10,pmaCorr:pc,peso:w,ratio:Math.round(r*100),score:Math.round(r*100),level:L[0],action:L[1],cls:L[2]};}

    '<section class="card"><div class="sv-kpis">'+k('EPIs por entregar',pe.length)+k('Ropa por entregar',(S.ropa||[]).filter(function(x){return x.status==='Pendiente';}).length)+k('EPIs sin acuse de recibo',ak.length)+k('Formaciones caducadas',tr.ex.length)+k('Caducan en 60 días',tr.soon.length)+k('Accidentes e incidentes abiertos',incOpenCount())+k('Días sin accidentes',incDaysNoLost()===null?'–':incDaysNoLost())+k('Documentos de contratas por revisar',caeAlerts())+k('Acciones fuera de plazo',insLate())+'</div></section>';
  var tl=function(g,i,t,d){return '<a href="#" data-go="'+g+'"><span>'+i+'</span><b>'+t+'</b><small>'+d+'</small></a>';};

  h+='<div class="grid two"><section class="card"><h2>🦺 EPIs</h2>'+(pe.slice(0,6).map(function(e){return '<div class="row wrap"><div><b class="no-tr">'+esc(e.no||'')+' · '+esc(e.name||'')+'</b><p><span class="no-tr">'+esc(e.section||'')+'</span> · '+epiFmt(e.req_at)+'</p></div><em>Pendiente</em></div>';}).join('')||'<p class="muted">No hay peticiones pendientes.</p>')+
    '<button data-go="epis">Ver EPIs</button></section>';
  h+='<section class="card"><h2>🎓 Formación</h2>'+(tr.ex.length||tr.soon.length?(tr.ex.length?'<h3>Caducadas</h3>'+tr.ex.slice(0,6).map(prlTrRow).join(''):'')+(tr.soon.length?'<h3>Caducan pronto</h3>'+tr.soon.slice(0,6).map(prlTrRow).join(''):''):'<p class="muted">No hay formaciones caducadas ni por caducar.</p>')+
    (tr.uns?'<p class="muted">Formaciones sin firmar por el trabajador: '+tr.uns+'</p>':'')+'<button data-go="formaciones">Ver formaciones</button></section></div>';
  h+='<div class="grid two"><section class="card"><h2>🩺 Reconocimientos médicos</h2>'+(camps.map(function(x){return '<div class="row wrap"><div><b class="no-tr">'+esc(x.c.title)+'</b><p>Han respondido '+x.n+' de '+x.t+'</p></div></div>';}).join('')||'<p class="muted">No hay campañas abiertas.</p>')+'<button data-go="formaciones">Gestionar campañas</button></section>';
  h+='<section class="card"><h2>✍️ Documentos para firmar</h2>'+(docs.slice(0,6).map(function(x){return '<div class="row wrap"><div><b class="no-tr">'+esc(x.d.title)+'</b><p>Firmado por '+x.s+' de '+x.t+'</p></div></div>';}).join('')||'<p class="muted">Todos los documentos están firmados.</p>')+'<button data-go="firmas">Ver documentos</button></section></div>';

function prlAccCard(){var l=S.employees.filter(function(e){return +e.prl===1&&e.active!==0;});
  return '<section class="card prl-acc"><h2>🦺 Técnico de prevención de riesgos (PRL)</h2><p class="muted">Gestiona EPIs, formaciones y revisiones, reconocimientos médicos y documentos para firmar de toda la plantilla. No ve nóminas, ausencias, fichajes ni datos personales.</p>'+
    (l.map(function(e){return '<div class="row wrap"><div><b class="no-tr">'+esc(e.name)+'</b><p>Nº de operario <span class="no-tr">'+esc(e.no)+'</span></p></div><button class="ghost" data-act="prloff" data-id="'+e.id+'">Quitar acceso</button></div>';}).join('')||'<p class="muted">Todavía no hay nadie con acceso de prevención.</p>')+
    '<form data-a="prlon"><label for="prlno">Nº de operario</label><input id="prlno" name="no" required inputmode="numeric" placeholder="Ej. 3330"><button class="primary">Dar acceso de prevención</button></form></section>';}
var _vAccesosPrl=VIEWS.accesos[0];VIEWS.accesos[0]=function(){var h=_vAccesosPrl();return role()==='hr'?h+prlAccCard():h;};
function prlSet(e,on){return rpc('p_set_prl',{p_target:e.id,p_on:on}).then(function(){e.prl=on?1:0;localPut('employees',e);
    flash(on?e.name+' ya tiene acceso de prevención. Entra con su nº de operario y su PIN y elige «Prevención de riesgos».':'Acceso de prevención quitado a '+e.name+'.','success');stay();},
  function(err){flash('No se ha podido guardar: '+((err&&err.message)||err),'error');stay();});}
A.prlon=function(f){var n=noNorm(f.no),e=S.employees.filter(function(x){return x.active!==0&&noNorm(x.no)===n;})[0];
  if(!e){flash('No hay nadie activo con ese nº de operario.','error');return stay();}
  if(+e.prl===1){flash(e.name+' ya tiene acceso de prevención.','success');return stay();}
  if(!confirm('¿Dar acceso de prevención de riesgos a '+e.name+' (nº '+e.no+')?\n\nVerá EPIs, formaciones, reconocimientos médicos y documentos para firmar de toda la plantilla.'))return;
  prlSet(e,true);};
C.prloff=function(b){var e=byId(S.employees,+b.dataset.id);if(!e||!confirm('¿Quitar el acceso de prevención a '+e.name+'?'))return;prlSet(e,false);};
prlWrap(A);prlWrap(C);

boot();
